# 项目级 Gradle 设置。
# 使用 IDE（例如 Android Studio）时：
# 通过 IDE 配置的 Gradle 设置会覆盖
# 此文件中指定的设置。
# 构建环境配置详情请参考
# http://www.gradle.org/docs/current/userguide/build_environment.html
# 指定 Gradle 守护进程使用的 JVM 参数。
# 该设置常用于调整内存配置。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# 启用后，Gradle 会以孵化状态的并行模式运行。
# 该选项仅适用于已解耦的多项目构建，详情请参考
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# 启用后，如果影响构建配置的内容没有变化，配置缓存可让 Gradle 跳过配置阶段。
# 例如构建脚本未发生变化时，Gradle 还能对任务执行应用性能优化。
org.gradle.configuration-cache=true
# 本项目使用的 Kotlin 代码风格，可选值为 "official" 或 "obsolete"。
kotlin.code.style=official
# 在单工作区内避免 Kotlin daemon 并发缓存争用导致的编译提示。
kotlin.compiler.execution.strategy=in-process
